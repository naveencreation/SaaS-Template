# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pip requirements
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate. This allows revision to autogenerate,
# but still ensure the environment is loaded.
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without also a .py file
# to be detected as revisions in the versions/ directory.
# sourceless = false

# version path separator; As mentioned above, this is the character
# used to split version locations. The default within new alembic.ini
# files is "os", which uses os.pathsep. If this key is omitted entirely,
# it falls back to the legacy behavior of splitting on spaces and/or
# commas. Valid values for version_path_separator are:
#
# version_path_separator = :
# version_path_separator = ;
# version_path_separator = space
version_path_separator = os  # Use os.pathsep. Default behavior.

# set to 'true' to search source files recursively for each version
# in the versions/ directory.
# recursive_version_locations = false

# the output encoding used when revision files are written.
# output_encoding = utf-8

# SQLAlchemy URL is set in env.py, not here
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples.

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
