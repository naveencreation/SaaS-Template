networks:
  saas-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:

services:
  postgres:
    image: postgres:15
    env_file: ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - saas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    networks:
      - saas-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
    networks:
      - saas-network

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    env_file: ../.env
    command: >
      sh -c "
        alembic upgrade head &&
        python scripts/seed.py &&
        python scripts/detect_unapplied.py
      "
    environment:
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - ../backend:/app/app
    networks:
      - saas-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    env_file: ../.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app
      - ../backend:/app/app
    environment:
      ENVIRONMENT: development
    depends_on:
      - migrate
      - redis
    networks:
      - saas-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    env_file: ../.env
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      BACKEND_URL: http://backend:8000/api
      APP_URL: ${APP_URL}
    depends_on:
      - backend
    networks:
      - saas-network
