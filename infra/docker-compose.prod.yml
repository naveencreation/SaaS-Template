# ━━━ Production Docker Compose ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Usage:
#   cp .env.prod.example .env.prod
#   # edit .env.prod with real values
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d
#
# Services: postgres, redis, migrate, backend, frontend, nginx, certbot

networks:
  saas-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  certbot_data:
  certbot_www:

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    env_file: ../.env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Migrations + Seed ───────────────────────────────────────────────────
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../.env.prod
    environment:
      ENVIRONMENT: production
    command: >
      sh -c "
        python scripts/check_prod_migrations.py &&
        alembic upgrade head &&
        python scripts/seed.py
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas-network
    restart: "no"

  # ── Backend ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../.env.prod
    environment:
      ENVIRONMENT: production
    depends_on:
      - migrate
      - redis
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    env_file: ../.env.prod
    environment:
      BACKEND_URL: http://backend:8000/api
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Nginx (reverse proxy + SSL) ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - frontend
    networks:
      - saas-network
    restart: unless-stopped

  # ── Certbot (SSL certificate automation) ────────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"
    networks:
      - saas-network
    restart: unless-stopped
